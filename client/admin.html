<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>MinerBlast — Vault Admin</title>
  <link rel="icon" type="image/png" href="/art/chars/bomb.png" />
  <link rel="stylesheet" href="/site.css" />
  <style>
    /* page-only tweaks; the design system is /site.css */
    main.doc { max-width: 720px; }
    main.doc .sec { margin-top: 34px; }
    .sec .ribbon { margin: -34px 0 4px 6px; }
    .sec .ribbon span { white-space: nowrap; }
    h1 .icon { margin: -6px 6px 0 0; }
    .stat-row { margin: 4px 0 0; }
    .stat-row dd { text-align: right; word-break: break-all; }
    label { display: block; color: var(--muted); font-size: 15px; margin: 4px 0 6px; }
    input { width: 100%; background: #101624; color: var(--text); border: 2px solid var(--border); border-radius: 6px; padding: 10px 12px;
      font-family: "Courier New", monospace; font-size: 16px; }
    input:focus { outline: none; border-color: var(--gold-dk); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 22px 0 4px; }
    #status { min-height: 24px; margin-top: 16px; color: var(--muted-lt); font-size: 15px; word-break: break-all; }
    #status.ok { color: var(--ok); } #status.err { color: var(--err); }
    @media (max-width: 640px) { .sec .ribbon { margin-left: 0; padding-left: 24px; padding-right: 24px; } .sec .ribbon span { font-size: 8px; } }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="doc">
    <h1><span class="icon icon-lock" aria-hidden="true"></span>Vault Admin</h1>
    <p class="muted">Funding panel for the MinerBlast reward vault. Every action must be
    signed by the owner wallet — this page has no power by itself.</p>

    <section class="panel-wood sec">
      <div class="ribbon"><span>STATUS</span></div>
      <div class="panel-dark">
        <dl class="stat-row">
          <dt>Connected wallet</dt><dd><b id="acct">—</b></dd>
          <dt>Your BLAST balance</dt><dd><b id="bal">—</b></dd>
          <dt>Vault BLAST balance</dt><dd><b id="vault">—</b></dd>
          <dt>Current allowance → vault</dt><dd><b id="allow">—</b></dd>
        </dl>
        <div class="actions">
          <button id="connect" class="btn btn-blue" type="button"><span class="icon icon-wallet"></span>Connect wallet</button>
        </div>
      </div>
    </section>

    <section class="panel-wood sec">
      <div class="ribbon"><span>FUND THE VAULT</span></div>
      <div class="panel-dark">
        <label for="amount">Amount (BLAST)</label>
        <input id="amount" value="60000000" inputmode="numeric" />
        <div class="actions">
          <button id="approve" class="btn btn-green" type="button" disabled>1 · Approve</button>
          <button id="fund" class="btn btn-gold" type="button" disabled><span class="icon icon-coin"></span>2 · Fund</button>
        </div>
        <div id="status"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/src/admin.ts"></script>
</body>
</html>
