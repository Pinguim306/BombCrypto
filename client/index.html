<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinerBlast — explosive mining on Robinhood Chain</title>
    <link rel="icon" type="image/png" href="/art/chars/bomb.png" />
    <link rel="stylesheet" href="/site.css" />
    <style>
      /* page-only tweaks live here; the design system is /site.css */
    </style>
  </head>
  <body>
    <div id="site-header"></div>

    <main class="stage">
      <div id="frame">
        <div id="game">
          <canvas id="godot-canvas" tabindex="0"></canvas>
          <div id="loader"><div class="bar"><i></i></div><span id="loader-text">loading the mine…</span></div>
          <div id="connect-overlay" hidden>
            <img class="logo-big" src="/art/ui/logo.png" alt="MinerBlast" width="576" height="128" />
            <div class="heroes-row" aria-hidden="true">
              <span class="hero hero-0"></span><span class="hero hero-1"></span><span class="hero hero-2"></span>
              <span class="hero hero-3"></span><span class="hero hero-4"></span><span class="hero hero-5"></span>
            </div>
            <button class="btn btn-gold btn-lg" data-kind="injected" type="button"><span class="icon icon-wallet"></span>Browser Wallet</button>
            <button class="btn btn-green btn-lg" data-kind="walletconnect" type="button" hidden><span class="icon icon-wallet"></span>Mobile Wallet</button>
            <p id="connect-status"></p>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
