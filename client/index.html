<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinerBlast — explosive mining on Robinhood Chain</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='9' y='1' width='2' height='2' fill='%23ffa726'/%3E%3Crect x='8' y='3' width='2' height='2' fill='%23ff7043'/%3E%3Crect x='4' y='5' width='8' height='8' fill='%23212121'/%3E%3Crect x='3' y='6' width='10' height='6' fill='%23212121'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%23607d8b'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg-0: #0b0f1a;
        --bg-1: #131a2b;
        --panel: #161d2e;
        --border: #2a3550;
        --orange: #e8952f;
        --orange-lt: #ffb74d;
        --text: #eceff1;
        --muted: #90a4ae;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        font-family: "Courier New", monospace;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 12%, rgba(232,149,47,.07), transparent 42%),
          radial-gradient(circle at 84% 78%, rgba(63,81,181,.10), transparent 46%),
          radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(160deg, var(--bg-1) 0%, var(--bg-0) 60%, #080b13 100%);
        background-size: auto, auto, 26px 26px, auto;
      }

      /* ---------- header ---------- */
      header {
        position: relative; /* anchor for the absolutely-centered PLAY */
        display: flex; align-items: center; gap: 18px;
        padding: 10px 22px;
        background: linear-gradient(180deg, #1a2336, var(--panel));
        border-bottom: 2px solid var(--border);
        box-shadow: 0 4px 18px rgba(0,0,0,.45);
        flex-wrap: wrap; justify-content: space-between;
      }
      /* three-zone header: logo (left) · PLAY (middle) · nav (right).
         space-between on the header balances PLAY between the logo and the
         nav, and the nav keeps its natural width so it never wraps on desktop. */
      .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: 0 0 auto; }
      .logo svg { image-rendering: pixelated; }
      .wordmark {
        font-size: 22px; font-weight: bold; letter-spacing: 1px;
        color: var(--orange-lt);
        text-shadow: 0 2px 0 #7a4a00, 0 4px 10px rgba(0,0,0,.6);
      }
      .wordmark span { color: #4fc3f7; }
      nav { display: flex; align-items: center; gap: 3px; flex: 0 1 auto; justify-content: flex-end; flex-wrap: wrap; }
      nav a, nav button {
        font-family: inherit; font-size: 12.5px; font-weight: bold;
        color: var(--text); background: transparent;
        border: 2px solid transparent; border-radius: 8px;
        padding: 8px 9px; cursor: pointer; text-decoration: none;
        letter-spacing: .3px; white-space: nowrap;
      }
      nav a:hover, nav button:hover { border-color: var(--border); background: rgba(255,255,255,.05); }
      .btn-play {
        /* Pinned to the exact horizontal center of the screen, out of the
           flex flow, so it never pushes the nav onto a second line. */
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        z-index: 20;
        font-family: inherit; font-weight: bold; letter-spacing: .5px;
        border-radius: 8px; cursor: pointer;
        background: linear-gradient(180deg, #ffb74d, var(--orange)) !important;
        color: #221400 !important; border: 2px solid #7a4a00 !important;
        font-size: 15px !important; padding: 8px 28px !important;
        box-shadow: 0 3px 0 #7a4a00;
      }
      .btn-play:active { transform: translate(-50%, -50%) translateY(2px); box-shadow: 0 1px 0 #7a4a00; }
      /* On narrower screens the nav would reach the center, so drop PLAY back
         into the normal flow (between logo and nav) to avoid any overlap. */
      @media (max-width: 1360px) {
        .btn-play { position: static; transform: none; }
        .btn-play:active { transform: translateY(2px); }
      }
      #wallet-chip {
        border: 2px solid var(--border); background: #101624;
        color: var(--muted); border-radius: 20px; padding: 8px 14px;
      }
      #wallet-chip.connected { color: #a5d6a7; border-color: #2e7d32; }

      /* ---------- Docs dropdown ---------- */
      .dropdown { position: relative; display: inline-flex; }
      .docs-menu {
        position: absolute; right: 0; top: calc(100% + 8px);
        display: none; flex-direction: column; min-width: 168px;
        background: #161d2e; border: 2px solid var(--border);
        border-radius: 10px; padding: 6px; z-index: 60;
        box-shadow: 0 12px 34px rgba(0,0,0,.55);
      }
      .dropdown.open .docs-menu { display: flex; }
      nav .docs-menu a {
        display: block; width: 100%; text-align: left;
        padding: 10px 12px; border-radius: 6px; border: 2px solid transparent;
      }
      nav .docs-menu a:hover { background: rgba(255,255,255,.06); border-color: var(--border); }

      /* ---------- $BLAST contract strip ---------- */
      #blast-ca {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        padding: 7px 10px; cursor: pointer; font-size: 13px;
        background: rgba(232,149,47,.08);
        border-bottom: 1px solid var(--border);
        color: var(--muted); letter-spacing: .4px;
      }
      #blast-ca:hover { background: rgba(232,149,47,.16); }
      #blast-ca .ca-label { color: var(--orange-lt); font-weight: bold; }
      #blast-ca #blast-ca-text { color: var(--text); font-weight: bold; }
      #blast-ca .ca-copy { color: var(--muted); }

      /* ---------- stage ---------- */
      main { display: flex; justify-content: center; padding: 26px 14px 40px; }
      #frame {
        /* also bound by viewport height so the game never sinks below the fold */
        width: min(96vw, 980px, calc((100vh - 150px) * 4 / 3));
        padding: 10px;
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 14px 44px rgba(0,0,0,.55), 0 0 60px rgba(232,149,47,.05);
      }
      #game { width: 100%; aspect-ratio: 4 / 3; }
      #game canvas { border-radius: 8px; }

      footer {
        text-align: center; color: var(--muted); font-size: 12px;
        padding: 0 14px 26px;
      }
      footer b { color: var(--orange-lt); }
    </style>
  </head>
  <body>
    <header>
      <a class="logo" href="/" aria-label="MinerBlast">
        <!-- Original MinerBlast logo: pixel bomb + crossed pickaxe -->
        <svg width="44" height="44" viewBox="0 0 22 22" shape-rendering="crispEdges">
          <!-- pickaxe behind -->
          <rect x="15" y="2" width="3" height="2" fill="#cfd8dc"/>
          <rect x="17" y="4" width="2" height="3" fill="#cfd8dc"/>
          <rect x="14" y="4" width="2" height="2" fill="#eceff1"/>
          <rect x="12" y="6" width="2" height="2" fill="#8d6e63"/>
          <rect x="10" y="8" width="2" height="2" fill="#8d6e63"/>
          <rect x="8" y="10" width="2" height="2" fill="#6d4c41"/>
          <!-- fuse + spark -->
          <rect x="13" y="1" width="2" height="2" fill="#ffee58"/>
          <rect x="12" y="3" width="2" height="2" fill="#ffa726"/>
          <rect x="11" y="5" width="1" height="2" fill="#ff7043"/>
          <!-- bomb body -->
          <rect x="5" y="7" width="8" height="2" fill="#263238"/>
          <rect x="3" y="9" width="12" height="8" fill="#263238"/>
          <rect x="5" y="17" width="8" height="2" fill="#263238"/>
          <rect x="4" y="9" width="10" height="7" fill="#212121"/>
          <!-- highlight -->
          <rect x="5" y="10" width="3" height="2" fill="#607d8b"/>
          <rect x="5" y="12" width="2" height="1" fill="#455a64"/>
        </svg>
        <span class="wordmark">MINER<span>BLAST</span></span>
      </a>
      <button class="btn-play" data-nav="play" type="button">PLAY</button>
      <nav>
        <button data-nav="daily">DAILY</button>
        <button data-nav="referrals">REFERRALS</button>
        <button data-nav="leaderboard">RANK</button>
        <button data-nav="heroes">HEROES</button>
        <button data-nav="market">MARKET</button>
        <button data-nav="shop">SHOP</button>
        <button id="wallet-chip" type="button" title="Click to disconnect">WALLET</button>
        <div class="dropdown" id="docs-dd">
          <button class="docs-btn" id="docs-btn" type="button" aria-haspopup="true" aria-expanded="false">DOCS ▾</button>
          <div class="docs-menu">
            <a href="/stats.html">STATS</a>
            <a href="/whitepaper.html">WHITEPAPER</a>
            <a href="/guide.html">GUIDE</a>
          </div>
        </div>
      </nav>
    </header>

    <div id="blast-ca" style="display:none" title="Click to copy the contract address">
      <span class="ca-label">$BLAST CA:</span>
      <span id="blast-ca-text"></span>
      <span class="ca-copy">⧉</span>
    </div>

    <main>
      <div id="frame"><div id="game"></div></div>
    </main>

    <footer>
      <b>MinerBlast</b> — built on <span id="net-name">Robinhood Chain</span><span id="net-disclaimer"></span>
    </footer>

    <script>
      // header -> game navigation (handled in src/main.ts)
      const nav = (t) => window.dispatchEvent(new CustomEvent("mb-nav", { detail: t }));
      document.querySelectorAll("[data-nav]").forEach((b) =>
        b.addEventListener("click", () => nav(b.dataset.nav))
      );

      // Docs dropdown (STATS / WHITEPAPER / GUIDE): toggle on click, close on outside click
      const docsDd = document.getElementById("docs-dd");
      const docsBtn = document.getElementById("docs-btn");
      docsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = docsDd.classList.toggle("open");
        docsBtn.setAttribute("aria-expanded", String(open));
      });
      document.addEventListener("click", () => {
        docsDd.classList.remove("open");
        docsBtn.setAttribute("aria-expanded", "false");
      });
      window.addEventListener("mb-wallet", (e) => {
        const chip = document.getElementById("wallet-chip");
        const a = e.detail;
        chip.textContent = a.slice(0, 6) + "…" + a.slice(-4);
        chip.classList.add("connected");
      });
      document.getElementById("wallet-chip").addEventListener("click", () => {
        const chip = document.getElementById("wallet-chip");
        if (!chip.classList.contains("connected")) return; // nothing to disconnect
        if (confirm("Disconnect this wallet from MinerBlast?")) {
          window.dispatchEvent(new CustomEvent("mb-disconnect"));
        }
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
